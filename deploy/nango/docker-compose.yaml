# Self-hosted Nango for devbout-oauth.
#
#   cd deploy/nango
#   cp .env.example .env   # then fill NANGO_ENCRYPTION_KEY + NANGO_SECRET_KEY
#   docker network create nango_network   # una sola vez (red compartida, ver abajo)
#   docker compose up -d
#
# v0.70+ runs everything on internal port 8080:
#   Dashboard + API:  http://localhost:3003  (mapeado a 8080 internamente)
#   Connect UI:       http://localhost:3009  (SPA embebida en el popup/iframe de login)
#
# NOTE: the bundled Postgres uses container-local storage and is fine for
# dev/staging. For production point NANGO_DB_* at a managed Postgres.
#
# Nango es una instancia COMPARTIDA entre las apps que consumen
# devbout-oauth (gestion.ar, nexsure, ...) — no vendorizada en cada una. Los
# consumidores en el mismo host se unen a `nango_network` (externa, creada a
# mano arriba) y le hablan a `nango-server` por nombre de servicio Docker
# (`http://nango-server:8080`) en vez de `host.docker.internal:3003`. La red
# es `external: true` en todos los compose que la usan para que un
# `docker compose down` de un solo proyecto no la destruya y huerfane a los
# demás (mismo motivo que `traefik_public` en gestion.ar/docker-compose.yml).
#
# Exposición pública en producción (dominio real + Traefik compartido del
# servidor, TLS automático): ver docker-compose.prod.yaml — no forma parte
# de este archivo para no acoplar el dev local (que no tiene Traefik) a la
# red externa `traefik_public`. Uso:
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
services:
  nango-db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${NANGO_DB_USER:-nango}
      POSTGRES_PASSWORD: ${NANGO_DB_PASSWORD:-nango}
      POSTGRES_DB: ${NANGO_DB_NAME:-nango}
    volumes:
      - nango-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NANGO_DB_USER:-nango}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nango-redis:
    image: redis:7
    restart: always

  nango-server:
    image: nangohq/nango-server:hosted
    restart: always
    # DNS explícito: el host resuelve vía IPv6 link-local (fe80::1%wlan0), que
    # Docker no puede propagar a los containers, dejándolos sin salida a
    # internet (oauth2.googleapis.com, login.microsoftonline.com, etc).
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      nango-db:
        condition: service_healthy
      nango-redis:
        condition: service_started
    ports:
      - "3003:8080"   # dashboard + API (v0.70+ escucha en 8080 internamente)
    environment:
      # ── secrets (set in .env) ──
      NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY}
      NANGO_SECRET_KEY: ${NANGO_SECRET_KEY}
      # ── database ──
      NANGO_DB_USER: ${NANGO_DB_USER:-nango}
      NANGO_DB_PASSWORD: ${NANGO_DB_PASSWORD:-nango}
      NANGO_DB_HOST: nango-db
      NANGO_DB_PORT: 5432
      NANGO_DB_NAME: ${NANGO_DB_NAME:-nango}
      # ── redis ──
      NANGO_REDIS_URL: redis://nango-redis:6379
      # ── URLs ──
      NANGO_SERVER_URL: ${NANGO_SERVER_URL:-http://localhost:3003}
      NANGO_PUBLIC_SERVER_URL: ${NANGO_SERVER_URL:-http://localhost:3003}
    networks:
      - default
      - shared

  # El image "hosted" trae el build de @nangohq/connect-ui (packages/connect-ui/dist)
  # pero no lo sirve. Lo exponemos con un server estático mínimo (sin deps) en :3009,
  # que es donde @nangohq/frontend espera encontrar el popup/iframe de Connect UI.
  nango-connect-ui:
    image: nangohq/nango-server:hosted
    restart: always
    volumes:
      - ./connect-ui-server.mjs:/connect-ui-server.mjs:ro
    command: ["node", "/connect-ui-server.mjs"]
    ports:
      - "3009:3009"

volumes:
  nango-db-data:

networks:
  default:
    name: nango_default
  # Compartida con los consumidores (gestion.ar, nexsure, ...) en el mismo
  # host — ver el comentario arriba. Crear una vez a mano:
  #   docker network create nango_network
  shared:
    name: nango_network
    external: true
