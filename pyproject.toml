[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "devbout-oauth"
version = "0.2.0"
description = "Central auth + integrations (Google/Microsoft) for Devbout apps, brokered by self-hosted Nango."
requires-python = ">=3.10"
dependencies = [
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
    "httpx>=0.28.0",
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["devbout_oauth*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
